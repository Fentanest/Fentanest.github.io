name: Clean completed Pages artifacts

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: completed-pages-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete artifacts only after successful Pages deployment
        env:
          ACTIONS_CLEANUP_TOKEN: ${{ github.token }}
          CLEANUP_REPOSITORY: ${{ github.repository }}
          CLEANUP_API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["CLEANUP_REPOSITORY"]
          base = os.environ["CLEANUP_API_URL"].rstrip("/") + "/repos/" + repo
          headers = {
              "Authorization": "Bearer " + os.environ["ACTIONS_CLEANUP_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(path, method="GET"):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  if method == "DELETE" and error.code == 404:
                      return False
                  raise

          def paged(path, key):
              page = 1
              while True:
                  result = api(f"{path}?per_page=100&page={page}")
                  rows = result[key]
                  yield from rows
                  if len(rows) < 100:
                      return
                  page += 1

          # Previously completed deployments explicitly selected for cleanup.
          run_ids = [40725197680, 40724138839, 40720803077, 40788939013]
          # The built-in Pages workflow is dynamic. Wait for this push's run
          # directly instead of relying on a workflow_run name trigger.
          commit = os.environ["GITHUB_SHA"]
          for attempt in range(36):
              result = api(f"/actions/runs?head_sha={commit}&per_page=100")
              pages_runs = [run for run in result["workflow_runs"]
                            if run["name"] == "pages build and deployment"
                            and run["head_sha"] == commit]
              if pages_runs and all(run["status"] == "completed" for run in pages_runs):
                  run_ids.extend(run["id"] for run in pages_runs)
                  break
              if attempt < 35:
                  time.sleep(5)
          else:
              print("No completed Pages run for this commit within three minutes; active runs are preserved")

          deleted = 0
          freed = 0
          for run_id in dict.fromkeys(run_ids):
              artifacts = [artifact for artifact in paged(f"/actions/runs/{run_id}/artifacts", "artifacts")
                           if artifact["name"] == "github-pages"]
              if not artifacts:
                  continue
              run = api(f"/actions/runs/{run_id}")
              if (run["name"] != "pages build and deployment"
                      or run["status"] != "completed"
                      or run["conclusion"] != "success"
                      or run["head_branch"] != "main"
                      or run.get("head_repository", {}).get("full_name") != repo):
                  print(f"Skip run {run_id}: not a successful main Pages run")
                  continue
              jobs = list(paged(f"/actions/runs/{run_id}/jobs", "jobs"))
              if not any(job["name"] == "deploy" and job["status"] == "completed"
                         and job["conclusion"] == "success" for job in jobs):
                  print(f"Skip run {run_id}: successful deploy job not found")
                  continue
              for artifact in artifacts:
                  result = api(f"/actions/artifacts/{artifact['id']}", "DELETE")
                  if result is False:
                      print(f"Artifact {artifact['id']} already absent")
                      continue
                  deleted += 1
                  freed += artifact["size_in_bytes"]
                  print(f"Deleted artifact {artifact['id']} from run {run_id}: {artifact['size_in_bytes']} bytes")
          summary = f"Deleted {deleted} completed Pages artifacts; released {freed} bytes."
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write(summary + "\n")
          PY
